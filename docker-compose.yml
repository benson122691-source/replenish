services:
  replenishai:
    build: .
    image: replenishai:latest
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # optional: enables /chat. Taken from your shell or a local .env (git-ignored); never commit it
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    restart: unless-stopped
    # health check is defined in the Dockerfile (HEALTHCHECK -> /health)
